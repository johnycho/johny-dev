<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>요청 흐름과 배포 유형</title>
<style>
/* 생성 파일: tools/diagrams/deploy-flow/build.mjs 가 만든다. 직접 고치지 말 것. */
:root {
/*TOKENS*/
  --font-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-mono: ui-monospace, Menlo, "Apple SD Gothic Neo", "Noto Sans KR", monospace;
}
html { color-scheme: /*SCHEME*/; background: transparent; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 4px; background: transparent; color: var(--ink); font-family: var(--font-body); -webkit-text-size-adjust: 100%; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; max-width: 100%; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 10px; padding: 0; }
.tabs[hidden] { display: none; }
.tabs button {
  font: 600 14px/1 var(--font-body); color: var(--muted); background: var(--soft); border: 1px solid var(--line);
  border-radius: 5px; padding: 6px 8px; min-width: 30px; cursor: pointer;
}
.tabs button[aria-selected="true"] { color: var(--hot); border-color: var(--hot); background: var(--hot-soft); }
.tabs button:hover { border-color: var(--hot); }
button:focus-visible, .nd:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.stack { display: grid; }
.stack > * { grid-area: 1 / 1; visibility: hidden; min-width: 0; }
.stack > .on { visibility: visible; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; row-gap: 4px; margin: 0 0 8px; }
.head h2 { margin: 0; font: 700 18px/1.3 var(--font-body); }
.head h2 .n { color: var(--hot); margin-right: 6px; }
.state { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font: 500 12px/1.4 var(--font-body); color: var(--muted); }
.state .pill { padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); }
.state .sp { width: 6px; }
.scene { background: var(--scene); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.sv-host { aspect-ratio: 600 / 380; }
.sv-host svg { display: block; width: 100%; height: 100%; }
.bar { height: 3px; background: var(--line); }
.bar span { display: block; height: 100%; width: 0; background: var(--hot); }
.caps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-top: none; border-radius: 0 0 6px 6px; }
.caps li { border-left: 1px solid var(--line); min-width: 0; }
.caps li:first-child { border-left: none; }
.caps button {
  all: unset; box-sizing: border-box; display: block; width: 100%; height: 100%; cursor: pointer;
  padding: 7px 9px 9px; font: 400 12.5px/1.45 var(--font-body); color: var(--muted); word-break: keep-all; overflow-wrap: anywhere;
}
.caps b { display: block; font: 600 11px/1.4 var(--font-mono); margin-bottom: 2px; }
.caps li.done button { color: var(--ink); }
.caps li.on button { color: var(--ink); background: var(--soft); }
.caps li.on b { color: var(--hot); }
.caps button:focus-visible { outline-offset: -2px; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 10px; }
.replay { font: 500 12.5px var(--font-body); color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; cursor: pointer; flex: none; }
.replay:hover { border-color: var(--hot); color: var(--hot); }
.legend { flex: 1 1 260px; margin: 0; font: 400 11.5px/1.5 var(--font-body); color: var(--muted); }
.legend .k { white-space: nowrap; margin-right: 8px; }
.legend .d { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.d.v1 { background: var(--v1); } .d.v2 { background: var(--v2); } .d.bad { background: var(--bad); } .d.off { background: var(--off); } .d.req { background: var(--req); }
.tabs .grp { font: 600 12px/1 var(--font-body); color: var(--muted); align-self: center; padding: 0 2px 0 4px; }
.tabs .grp:not(:first-child) { margin-left: 8px; }
.state .vlab { font: 500 11.5px/1.4 var(--font-mono); color: var(--muted); margin-right: -4px; }
.state .vbtn { font: 500 11.5px/1.4 var(--font-mono); color: var(--muted); background: var(--soft); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; cursor: pointer; }
.state .vbtn:hover { border-color: var(--hot); }
.state .vbtn[aria-pressed="true"] { color: var(--hot); border-color: var(--hot); background: var(--hot-soft); }
.vstack { display: grid; }
.vstack > * { grid-area: 1 / 1; visibility: hidden; min-width: 0; }
.stack > .vstack.on > .on { visibility: visible; }
.call rect { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.4; }
.call text { fill: var(--hot); font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; }
.pushln { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-linejoin: round; }
.pushh { fill: var(--hot); }
.ag { fill: var(--hot); }
.qx { fill: var(--bad); stroke: var(--wall); stroke-width: 1.5; }
.state .pill.mono { font-family: var(--font-mono); font-size: 11.5px; overflow-wrap: anywhere; }
@media (max-width: 560px) {
  .card { padding: 8px 8px 10px; }
  .head h2 { font-size: 16px; }
  .caps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .caps li:nth-child(3) { border-left: none; }
  .caps li:nth-child(n+3) { border-top: 1px solid var(--line); }
  .caps button { font-size: 12px; padding: 6px 8px 8px; }
}

/* ---------- scene drawing ---------- */
.sv text { font-family: var(--font-body); }
.sv .mono { font-family: var(--font-mono); }
.pop { transform-box: fill-box; transform-origin: center; }
.fade { opacity: .3; }
.frame { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 4; }
.frame.sub { stroke: var(--line); stroke-width: 1.4; }
.fr-t { fill: var(--muted); font-size: 10.5px; font-weight: 700; }
.nb-r { fill: var(--wall); stroke: var(--stroke); stroke-width: 1.4; }
.nb-t { fill: var(--ink); font-size: 14px; font-weight: 700; }
.nb-s { fill: var(--muted); font-size: 12px; font-weight: 600; }
.nb-t.v1 { fill: var(--v1); } .nb-t.v2 { fill: var(--v2); }
.nb-r.v1 { stroke: var(--v1); } .nb-r.v2 { stroke: var(--v2); }
.nb-s.ok { fill: var(--v2); } .nb-s.bad { fill: var(--bad); } .nb-s.hot { fill: var(--hot); }
.nb-r.bad { fill: var(--bad-soft); stroke: var(--bad); }
.halo { fill: none; stroke: var(--hot); stroke-width: 3; }
.lbl { fill: var(--ink); font-size: 13px; font-weight: 600; }
.mut { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
.ln { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; }
.ln.dash { stroke-dasharray: 5 4; }
.ln.v1 { stroke: var(--v1); stroke-width: 2.2; } .ln.v2 { stroke: var(--v2); stroke-width: 2.2; }
.bus { fill: none; stroke: var(--off); stroke-width: 2; stroke-linejoin: round; opacity: .55; }
.stub { stroke-width: 2.6; stroke-linecap: round; }
.stub.v1 { stroke: var(--v1); } .stub.v2 { stroke: var(--v2); }
.stub.bad { stroke: var(--bad); stroke-dasharray: 4 3; }
.tb { stroke-width: 1.6; }
.tv { font-size: 15px; font-weight: 800; }
.ts { font-size: 12px; font-weight: 600; }
.tb.v1 { fill: var(--v1-soft); stroke: var(--v1); } .tv.v1, .ts.v1 { fill: var(--v1); }
.tb.v2 { fill: var(--v2-soft); stroke: var(--v2); } .tv.v2, .ts.v2 { fill: var(--v2); }
.tb.up { fill: var(--wall); stroke: var(--v2); stroke-dasharray: 4 3; } .tv.up { fill: var(--v2); } .ts.up { fill: var(--muted); }
.tb.bad { fill: var(--bad-soft); stroke: var(--bad); } .tv.bad, .ts.bad { fill: var(--bad); }
.tb.dr { fill: var(--off-soft); stroke: var(--off); } .tv.dr, .ts.dr { fill: var(--off); }
.tb.stp { fill: var(--scene); stroke: var(--off); stroke-dasharray: 3 3; } .tv.stp, .ts.stp { fill: var(--off); }
.tb.inst { fill: var(--off-soft); stroke: var(--off); stroke-dasharray: 4 3; } .tv.inst, .ts.inst { fill: var(--muted); }
.q { fill: var(--req); stroke: var(--wall); stroke-width: 1.5; }
.qt { fill: var(--wall); stroke: var(--v2); stroke-width: 2.6; }
.hc { fill: var(--muted); }
.bd { stroke-width: 1; }
.bd.k { fill: var(--wall); stroke: var(--muted); } .bd-t.k { fill: var(--ink); }
.bd.ok { fill: var(--v2-soft); stroke: var(--v2); } .bd-t.ok { fill: var(--v2); }
.bd.bad { fill: var(--bad-soft); stroke: var(--bad); } .bd-t.bad { fill: var(--bad); }
.bd.hot { fill: var(--hot-soft); stroke: var(--hot); } .bd-t.hot { fill: var(--hot); }
.bd.v1 { fill: var(--v1-soft); stroke: var(--v1); } .bd-t.v1 { fill: var(--v1); }
.bd-t { font-size: 12.5px; font-weight: 700; }
.tag { fill: var(--soft); stroke: var(--muted); stroke-width: 1; }
.tag-t { fill: var(--ink); font-size: 12px; font-weight: 600; }
.tag-f { fill: none; stroke: var(--hot); stroke-width: 2.2; }
.brw-bar { stroke: var(--stroke); stroke-width: 1.2; }
.brw-dot { fill: var(--muted); }
.pg1 { fill: var(--muted); opacity: .55; } .pg2 { fill: var(--line); }
.file rect { fill: var(--wall); stroke: var(--req); stroke-width: 1.5; }
.file text { fill: var(--req); font-size: 10.5px; font-weight: 800; }
.cp { fill: var(--soft); stroke: var(--line); stroke-width: 1; }
.cp-t { fill: var(--muted); font-size: 12px; font-weight: 600; }
.cp.run { fill: var(--hot-soft); stroke: var(--hot); } .cp-t.run { fill: var(--hot); }
.cp.done { fill: var(--v2-soft); stroke: var(--v2); } .cp-t.done { fill: var(--v2); }
.cp.hot { fill: var(--hot-soft); stroke: var(--hot); } .cp-t.hot { fill: var(--hot); font-weight: 700; }
.ring { fill: none; stroke: var(--hot); stroke-width: 2.5; }
.xm { fill: none; stroke: var(--bad); stroke-width: 2.6; stroke-linecap: round; }
.nolink { fill: none; stroke: var(--bad); stroke-width: 1.6; stroke-dasharray: 4 3; }
.g-blue { fill: var(--v1); } .g-green { fill: var(--v2); }
.g-tick { stroke: var(--sheet); stroke-width: 1.2; opacity: .7; }
.g-t { font-size: 11px; font-weight: 700; }
.g-t.v1 { fill: var(--v1); } .g-t.v2 { fill: var(--v2); }
.tm-bg { fill: none; stroke: var(--line); stroke-width: 4; }
.tm { fill: none; stroke: var(--hot); stroke-width: 4; stroke-linecap: round; }
.tm-t { fill: var(--ink); font-size: 12px; font-weight: 700; }
.bake-bg { fill: var(--line); } .bake { fill: var(--v1); }
.arrh { fill: var(--muted); }
.img rect { fill: var(--v2-soft); stroke: var(--v2); stroke-width: 1.4; }
.img text { fill: var(--v2); font-size: 10.5px; font-weight: 800; }
</style>
</head>
<body>
<div class="card" id="fig">
  <div class="tabs" id="tabs" role="tablist" aria-label="단계 선택"></div>
  <div class="stack" id="heads"></div>
  <div class="scene" id="scene" role="tabpanel"><div class="sv-host" id="host"></div><div class="bar"><span id="bar"></span></div></div>
  <div class="stack" id="capstack"></div>
  <div class="foot">
    <button class="replay" id="replay" type="button">↻ 다시 재생</button>
    <p class="legend"><span class="k"><i class="d v1"></i>v1(파랑): 기존 버전</span><span class="k"><i class="d v2"></i>v2(초록): 새 버전</span><span class="k"><i class="d bad"></i>빨강: 헬스 체크 실패</span><span class="k"><i class="d off"></i>회색: 드레이닝, 중지</span><span class="k"><i class="d req"></i>점: 요청</span></p>
  </div>
</div>
<script>
/*ANIME*/
</script>
<script>
/*SCENES*/
</script>
</body></html>
