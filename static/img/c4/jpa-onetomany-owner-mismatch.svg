<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="440" height="300" fill="#FFFFFF"/>
<rect x="60" y="16" width="320" height="52" rx="6" fill="#FFFBEA" stroke="#E0A000"/>
<text x="220.0" y="38.5" font-size="12" fill="#5A4300" text-anchor="middle" font-weight="bold">Member (ONE 쪽, @OneToMany 단방향)</text>
<text x="220.0" y="53.5" font-size="10.5" fill="#444" text-anchor="middle">FK 컬럼이 없다</text>
<rect x="60" y="232" width="320" height="52" rx="6" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="220.0" y="254.5" font-size="12" fill="#2E6B2E" text-anchor="middle" font-weight="bold">orders 테이블 (MANY 쪽)</text>
<text x="220.0" y="269.5" font-size="10.5" fill="#444" text-anchor="middle">id | member_id ← FK는 여기 있다</text>
<line x1="150" y1="68" x2="150" y2="231" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="166" y="112" font-size="11" fill="#333" text-anchor="start">주인인데 내 테이블엔</text>
<text x="166" y="128" font-size="11" fill="#333" text-anchor="start">FK가 없어서</text>
<text x="166" y="144" font-size="11" fill="#333" text-anchor="start">orders.member_id를</text>
<text x="166" y="160" font-size="11" fill="#333" text-anchor="start">원격으로 채움</text>
<text x="166" y="176" font-size="11" fill="#333" text-anchor="start">→ INSERT 뒤 별도 UPDATE</text>
</svg>
