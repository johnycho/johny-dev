<svg xmlns="http://www.w3.org/2000/svg" width="440" height="400" viewBox="0 0 440 400" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="440" height="400" fill="#FFFFFF"/>
<text x="220.0" y="22" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">외부 트래픽 경로 — Ingress → Service → 파드</text>
<rect x="26" y="38" width="160" height="40" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="106.0" y="54.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">외부 사용자</text>
<text x="106.0" y="70.32" font-size="10.5" fill="#444" text-anchor="middle">브라우저</text>
<line x1="106" y1="78" x2="106" y2="117" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="114" y="102" font-size="10" fill="#555" text-anchor="start">HTTP(S)</text>
<rect x="26" y="118" width="160" height="58" rx="6" fill="#EEF3FB" stroke="#4C7FE0"/>
<text x="106.0" y="135.32" font-size="12" fill="#26508F" text-anchor="middle" font-weight="bold">Ingress Controller</text>
<text x="106.0" y="151.32" font-size="10" fill="#444" text-anchor="middle">워커 노드의 파드, L7</text>
<text x="106.0" y="167.32" font-size="10" fill="#444" text-anchor="middle">nginx, ALB 등</text>
<line x1="106" y1="176" x2="106" y2="215" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="114" y="200" font-size="10" fill="#555" text-anchor="start">L7 라우팅</text>
<rect x="26" y="216" width="160" height="58" rx="6" fill="#EEF3FB" stroke="#4C7FE0"/>
<text x="106.0" y="233.32" font-size="12" fill="#26508F" text-anchor="middle" font-weight="bold">Service</text>
<text x="106.0" y="249.32" font-size="10" fill="#444" text-anchor="middle">고정 진입점, L4</text>
<text x="106.0" y="265.32" font-size="10" fill="#444" text-anchor="middle">kube-proxy</text>
<line x1="106" y1="274" x2="106" y2="300" stroke="#888" stroke-width="1.2"/>
<path d="M106,300 L58,300 L58,327" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<path d="M106,300 L154,300 L154,327" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="114" y="292" font-size="10" fill="#555" text-anchor="start">L4 부하분산</text>
<rect x="14" y="328" width="88" height="40" rx="6" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="58.0" y="344.39" font-size="11.5" fill="#2E6B2E" text-anchor="middle" font-weight="bold">파드 A</text>
<text x="58.0" y="359.89" font-size="10" fill="#444" text-anchor="middle">컨테이너</text>
<rect x="110" y="328" width="88" height="40" rx="6" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="154.0" y="344.39" font-size="11.5" fill="#2E6B2E" text-anchor="middle" font-weight="bold">파드 B</text>
<text x="154.0" y="359.89" font-size="10" fill="#444" text-anchor="middle">컨테이너</text>
<rect x="212" y="112" width="216" height="82" rx="6" fill="#FFFBEA" stroke="#E0A000" stroke-dasharray="5 4"/>
<text x="224" y="131" font-size="11" fill="#5A4300" text-anchor="start" font-weight="bold">L7 — Ingress</text>
<text x="224" y="150" font-size="10" fill="#5A4300" text-anchor="start">• Ingress Controller = 워커 노드의 파드</text>
<text x="224" y="166" font-size="10" fill="#5A4300" text-anchor="start">• 도메인, 경로 라우팅 + TLS 종료</text>
<text x="224" y="182" font-size="10" fill="#5A4300" text-anchor="start">• Ingress는 규칙일 뿐, 컨트롤러가 실행</text>
<rect x="212" y="212" width="216" height="66" rx="6" fill="#FFFBEA" stroke="#E0A000" stroke-dasharray="5 4"/>
<text x="224" y="231" font-size="11" fill="#5A4300" text-anchor="start" font-weight="bold">L4 — Service</text>
<text x="224" y="250" font-size="10" fill="#5A4300" text-anchor="start">• Service = 파드 앞 고정 진입점</text>
<text x="224" y="266" font-size="10" fill="#5A4300" text-anchor="start">• kube-proxy가 파드로 부하 분산</text>
</svg>
