<text x="24" y="58" font-size="13" fill="#333" text-anchor="start" font-weight="bold">Bitmap</text>
<text x="416" y="58" font-size="9.5" fill="#888" text-anchor="end">비트 한 개 = 사용자 한 명의 출석 여부</text>
