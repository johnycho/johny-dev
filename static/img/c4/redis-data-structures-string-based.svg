<rect x="214" y="394" width="202" height="34" rx="4" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="315" y="414.7" font-size="10.5" fill="#2E6B2E" text-anchor="middle" font-weight="bold">PFCOUNT visitors → 약 2</text>
