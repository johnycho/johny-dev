<rect x="0" y="0" width="440" height="352" fill="#FFFFFF"/>
<text x="220.0" y="22" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">ALB(L7)와 NLB(L4)가 요청에서 보는 범위</text>
