<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="440" height="300" fill="#FFFFFF"/>
  <text x="220" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#222222">인덱스 위에서 두 작업의 잠금 범위가 겹친다</text>
  <rect x="148" y="48" width="277" height="168" rx="7" fill="#FFFBEA" stroke="#E0A000" stroke-dasharray="5 4"/>
  <rect x="153" y="54" width="267" height="27" rx="5" fill="#D6E4FB" stroke="#4C7FE0"/>
  <text x="286" y="72" text-anchor="middle" font-size="11" fill="#26508F">resend(B) next-key 요청 (갭 + MAIL) — 대기 중</text>
  <rect x="20" y="100" width="133" height="64" rx="4" fill="#EEF3FB" stroke="#B9CBE8"/>
  <rect x="153" y="100" width="134" height="64" rx="4" fill="#FFF3E0" stroke="#E8C98F"/>
  <rect x="287" y="100" width="133" height="64" rx="4" fill="#FCE4EC" stroke="#E0A8BC"/>
  <text x="86" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#222222">검색 범위</text>
  <text x="86" y="137" text-anchor="middle" font-size="9.5" fill="#444444">SLACK, line 706793</text>
  <text x="86" y="151" text-anchor="middle" font-size="9.5" fill="#444444">~ 706800</text>
  <text x="220" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#222222">갭 (빈 구간)</text>
  <text x="220" y="137" text-anchor="middle" font-size="9.5" fill="#444444">배치가 삽입하려는 곳</text>
  <text x="220" y="151" text-anchor="middle" font-size="9.5" fill="#B0486A">resend 요청이 먼저 대기</text>
  <text x="353" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#222222">MAIL 레코드</text>
  <text x="353" y="137" text-anchor="middle" font-size="9.5" fill="#444444">line 706809 (범위 다음 행)</text>
  <text x="353" y="151" text-anchor="middle" font-size="9.5" fill="#B0486A">배치 보유, resend 대기</text>
  <rect x="153" y="184" width="267" height="27" rx="5" fill="#FBDCE4" stroke="#D06A86"/>
  <text x="286" y="202" text-anchor="middle" font-size="11" fill="#9E3A57">배치(A): MAIL 락 보유 + 갭에 삽입 대기</text>
  <text x="220" y="236" text-anchor="middle" font-size="10" fill="#888888">← 인덱스 순서 (line_id, type, sent_at) →</text>
  <text x="220" y="259" text-anchor="middle" font-size="11" fill="#333333">중복되는 갭과 MAIL 구간에서 서로를 기다려 교착</text>
  <text x="220" y="276" text-anchor="middle" font-size="11" fill="#333333">→ MySQL이 resend를 강제 롤백</text>
</svg>
