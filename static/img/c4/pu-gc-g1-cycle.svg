<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:510px;height:645px;background:#FFFFFF;" width="510px" height="645px" viewBox="0 0 510 645" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="63.186" y="32.995" fill="#000" font-size="14" textLength="382.506" font-weight="700">G1 GC 동작 흐름 — Young GC → 동시 마킹 → Mixed GC</text></g><ellipse cx="289.001" cy="62.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="214.025" y="92.297" width="149.952" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="224.025" y="113.436" fill="#000" font-size="12" textLength="129.952">Eden 구역이 가득 채워짐</text><rect x="101.044" y="146.266" width="375.913" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="111.044" y="167.404" fill="#000" font-size="12" textLength="132.506">Young GC [STW · 짧음]</text><text x="111.044" y="181.373" fill="#000" font-size="12" textLength="355.913">사용 중인 객체를 Survivor/Old 구역으로 복사하고 Eden 영역을 회수</text><polygon points="180.034,214.203,397.968,214.203,409.968,226.203,397.968,238.203,180.034,238.203,168.034,226.203,180.034,214.203" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="180.034" y="230.011" fill="#000" font-size="11" textLength="217.934">Old 사용량이 임계치를 넘었나? 기본 45퍼센트</text><text x="157.914" y="223.609" fill="#000" font-size="11">예</text><text x="409.968" y="223.609" fill="#000" font-size="11" textLength="30.36">아니오</text><rect x="49.667" y="248.203" width="216.735" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="59.667" y="269.342" fill="#000" font-size="12" textLength="196.735">동시 마킹 Concurrent Marking 시작</text><rect x="68.84" y="302.172" width="178.389" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="78.84" y="323.311" fill="#000" font-size="12" textLength="158.389">Initial Mark [아주 짧은 STW]</text><rect x="61.217" y="356.141" width="193.633" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="71.217" y="377.279" fill="#000" font-size="12" textLength="161.647">Concurrent Mark [앱과 동시]</text><text x="71.217" y="391.248" fill="#000" font-size="12" textLength="173.633">구역별 사용하지 않는 객체 양 계산</text><rect x="61.408" y="424.078" width="193.252" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="71.408" y="445.217" fill="#000" font-size="12" textLength="173.252">Remark · Cleanup [짧은 STW]</text><text x="71.408" y="459.186" fill="#000" font-size="12" textLength="136.699">객체 없는 구역은 즉시 회수</text><rect x="16" y="492.016" width="284.068" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="513.154" fill="#000" font-size="12" textLength="97.271">Mixed GC [STW]</text><text x="26" y="527.123" fill="#000" font-size="12" textLength="264.068">Young + 사용하지 않는 객체 많은 Old 구역 일부를</text><text x="26" y="541.092" fill="#000" font-size="12" textLength="128.928">함께 회수 garbage first</text><rect x="349.057" y="248.203" width="141.822" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="359.057" y="269.342" fill="#000" font-size="12" textLength="121.822">Young GC만 계속 반복</text><polygon points="289.001,559.922,301.001,571.922,289.001,583.922,277.001,571.922,289.001,559.922" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="289.001" cy="614.922" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="289.001" cy="614.922" rx="6" ry="6" fill="#222" style=