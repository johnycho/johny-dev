<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="480" height="280" fill="#FFFFFF"/>
<text x="240.0" y="22" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">멤버 생존을 판단하는 두 신호</text>
<rect x="15" y="42" width="165" height="224" rx="8" fill="#FFFAF2" stroke="#E0A000" stroke-dasharray="4 3"/>
<text x="27" y="60" font-size="11" fill="#7A5200" text-anchor="start" font-weight="bold">컨슈머 인스턴스</text>
<rect x="25" y="96" width="145" height="40" rx="6" fill="#FFF3E0" stroke="#E0A000"/>
<text x="97.5" y="119.75" font-size="11.5" fill="#7A5200" text-anchor="middle" font-weight="bold">하트비트 스레드</text>
<rect x="25" y="206" width="145" height="40" rx="6" fill="#FFF3E0" stroke="#E0A000"/>
<text x="97.5" y="229.75" font-size="11.5" fill="#7A5200" text-anchor="middle" font-weight="bold">처리 스레드 (poll 루프)</text>
<rect x="370" y="60" width="100" height="200" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="420.0" y="163.75" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">그룹 코디네이터</text>
<line x1="170" y1="116" x2="368" y2="116" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="275" y="72" font-size="10.5" fill="#333" text-anchor="middle">Heartbeat (기본 3초 주기)</text>
<text x="275" y="86" font-size="10.5" fill="#333" text-anchor="middle">중단되고 session.timeout(45초)</text>
<text x="275" y="100" font-size="10.5" fill="#333" text-anchor="middle">지나면 사망 판정</text>
<line x1="170" y1="226" x2="368" y2="226" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="275" y="182" font-size="10.5" fill="#333" text-anchor="middle">poll 재호출</text>
<text x="275" y="196" font-size="10.5" fill="#333" text-anchor="middle">max.poll.interval(5분) 넘기면</text>
<text x="275" y="210" font-size="10.5" fill="#333" text-anchor="middle">처리 정지 판정</text>
</svg>
