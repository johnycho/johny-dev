<svg xmlns="http://www.w3.org/2000/svg" width="440" height="412" viewBox="0 0 440 412" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="440" height="412" fill="#FFFFFF"/>
<text x="220.0" y="22" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Config Server의 복호화 처리</text>
<rect x="60" y="36" width="320" height="44" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="220.0" y="54" font-size="10.5" fill="#555" text-anchor="middle" font-weight="bold">설정 저장소 (Git, FileSystem, Vault)</text>
<text x="220.0" y="71" font-size="10.5" fill="#333" text-anchor="middle" font-family="Menlo, Consolas, monospace">my.secret={cipher}...</text>
<line x1="220.0" y1="80" x2="220.0" y2="94" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="60" y="94" width="320" height="44" rx="6" fill="#EEF3FB" stroke="#4C7FE0"/>
<text x="220.0" y="112" font-size="10.5" fill="#26508F" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">EnvironmentRepository.findOne()</text>
<text x="220.0" y="129" font-size="10.5" fill="#333" text-anchor="middle">설정 파일을 읽어 Environment 생성</text>
<line x1="220.0" y1="138" x2="220.0" y2="152" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="60" y="152" width="320" height="44" rx="6" fill="#EEF3FB" stroke="#4C7FE0"/>
<text x="220.0" y="170" font-size="10.5" fill="#26508F" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">EnvironmentEncryptor.decrypt()</text>
<text x="220.0" y="187" font-size="10.5" fill="#333" text-anchor="middle">{cipher} 접두어 항목 복호화 시도</text>
<line x1="220.0" y1="196" x2="220.0" y2="210" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="120" y="210" width="200" height="30" rx="6" fill="#FFF3E0" stroke="#E0A000"/>
<text x="220.0" y="229" font-size="10.5" fill="#333" text-anchor="middle">복호화에 성공했는가?</text>
<line x1="170.0" y1="240" x2="115.0" y2="268" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="146.0" y="256" font-size="10" fill="#555" text-anchor="middle" font-weight="bold">Y</text>
<line x1="270.0" y1="240" x2="325.0" y2="268" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="294.0" y="256" font-size="10" fill="#555" text-anchor="middle" font-weight="bold">N</text>
<rect x="20" y="268" width="190" height="64" rx="6" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="115.0" y="294" font-size="10" fill="#2E6B2E" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">my.secret=복호화한 값</text>
<text x="115.0" y="312" font-size="10.5" fill="#333" text-anchor="middle">원래 키 그대로 전달</text>
<rect x="230" y="268" width="190" height="64" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="325.0" y="288" font-size="10" fill="#9E3A57" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">invalid.my.secret=&lt;n/a&gt;</text>
<text x="325.0" y="306" font-size="10.5" fill="#333" text-anchor="middle">키 이름에 invalid. 접두어 추가</text>
<text x="325.0" y="323" font-size="9.5" fill="#888" text-anchor="middle">(prefixInvalidProperties가 true일 때)</text>
<line x1="115.0" y1="332" x2="115.0" y2="353" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="325.0" y1="332" x2="325.0" y2="353" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="20" y="354" width="400" height="44" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="220.0" y="372" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold">Config Client에 Environment(JSON) 반환</text>
<text x="220.0" y="389" font-size="10.5" fill="#9E3A57" text-anchor="middle">복호화 실패 시 응답에 my.secret 키가 없음</text>
</svg>
