<svg xmlns="http://www.w3.org/2000/svg" width="440" height="292" viewBox="0 0 440 292" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="440" height="292" fill="#FFFFFF"/>
<text x="220.0" y="22" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Config Client가 my.secret 값을 찾는 순서</text>
<rect x="20" y="40" width="250" height="62" rx="6" fill="#EEF3FB" stroke="#4C7FE0"/>
<text x="145.0" y="58" font-size="10.5" fill="#26508F" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">configserver:* PropertySource</text>
<text x="145.0" y="76" font-size="10" fill="#333" text-anchor="middle" font-family="Menlo, Consolas, monospace">invalid.my.secret=&lt;n/a&gt;</text>
<text x="145.0" y="93" font-size="10.5" fill="#9E3A57" text-anchor="middle">my.secret 키 없음</text>
<rect x="300" y="55" width="124" height="32" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="362.0" y="75" font-size="10.5" fill="#9E3A57" text-anchor="middle" font-weight="bold">1차 탐색: 찾지 못함</text>
<line x1="270" y1="71" x2="298" y2="71" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="145.0" y1="102" x2="145.0" y2="140" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="153.0" y="126" font-size="10" fill="#555" text-anchor="start">다음 PropertySource로 진행</text>
<rect x="20" y="142" width="250" height="62" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="145.0" y="160" font-size="10.5" fill="#555" text-anchor="middle" font-weight="bold">로컬 application.properties</text>
<text x="145.0" y="178" font-size="10" fill="#333" text-anchor="middle" font-family="Menlo, Consolas, monospace">my.secret=localValue</text>
<text x="145.0" y="195" font-size="10.5" fill="#2E6B2E" text-anchor="middle">my.secret 키 있음</text>
<rect x="300" y="157" width="124" height="32" rx="6" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="362.0" y="177" font-size="10.5" fill="#2E6B2E" text-anchor="middle" font-weight="bold">2차 탐색: 찾음</text>
<line x1="270" y1="173" x2="298" y2="173" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="20" y="222" width="404" height="36" rx="6" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="220.0" y="244" font-size="11" fill="#2E6B2E" text-anchor="middle" font-weight="bold">애플리케이션에는 localValue가 적용됨</text>
<line x1="145.0" y1="204" x2="145.0" y2="220" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="220.0" y="278" font-size="9.5" fill="#888" text-anchor="middle">invalid.my.secret은 실패 흔적으로만 남고 참조되지 않음</text>
</svg>
