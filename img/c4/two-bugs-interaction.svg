<text x="220.0" y="98.0" font-size="11.5" fill="#444" text-anchor="middle">항목 A 전환</text>
<line x1="220" y1="109" x2="220" y2="122" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="70" y="123" width="300" height="30" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="220.0" y="142.0" font-size="11.5" fill="#444" text-anchor="middle">외부 예약 취소 성공 (실제 삭제)</text>
<line x1="220" y1="153" x2="220" y2="166" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="70" y="167" width="300" height="30" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="220.0" y="186.0" font-size="11.5" fill="#444" text-anchor="middle">markCancelled 유실 → 행은 그대로 예약중</text>
<line x1="220" y1="197" x2="220" y2="210" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="70" y="211" width="300" height="30" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="220.0" y="230.0" font-size="11.5" fill="#444" text-anchor="middle">같은 식별자의 항목 B 전환</text>
<line x1="220" y1="241" x2="220" y2="254" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="70" y="255" width="300" height="30" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="220.0" y="274.0" font-size="11.5" fill="#444" text-anchor="middle">조회가 그 행을 여전히 "예약중"으로 반환</text>
<line x1="220" y1="285" x2="220" y2="298" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="70" y="299" width="300" height="30" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="220.0" y="318.0" font-size="11.5" fill="#444" text-anchor="middle">같은 식별자 재취소 → 이미 사라진 예약 거부</text>
<line x1="220" y1="329" x2="220" y2="342" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="70" y="343" width="300" height="30" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="220.0" y="362.0" font-size="11.5" fill="#444" text-anchor="middle">항목 C, D … 반복 → 에러 반복 발생</text>
<line x1="220" y1="373" x2="220" y2="386" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<circle cx="220" cy="395" r="8" fill="#FFFFFF" stroke="#555" stroke-width="1.5"/>
<circle cx="220" cy="395" r="4.5" fill="#555"/>
