<svg xmlns="http://www.w3.org/2000/svg" width="440" height="406" viewBox="0 0 440 406" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="440" height="406" fill="#FFFFFF"/>
<text x="220" y="22" font-size="13" fill="#333" font-weight="bold" text-anchor="middle">DB 쓰기 유실과 식별자 공유가 함께 작용해</text>
<text x="220" y="39" font-size="13" fill="#333" font-weight="bold" text-anchor="middle">에러가 반복되는 흐름</text>
<circle cx="220" cy="58" r="7" fill="#555"/>
<line x1="220" y1="65" x2="220" y2="78" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
