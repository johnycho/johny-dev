<svg xmlns="http://www.w3.org/2000/svg" width="440" height="580" viewBox="0 0 440 580" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="440" height="580" fill="#FFFFFF"/>
<text x="220" y="22" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">G1 GC 동작 흐름 — Young GC → 동시 마킹 → Mixed GC</text>
<circle cx="220" cy="46" r="8" fill="#333"/>
<line x1="220" y1="54" x2="220" y2="67" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="120" y="68" width="200" height="28" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="220.0" y="86.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">Eden 구역이 가득 채워짐</text>
<line x1="220" y1="96" x2="220" y2="109" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="40" y="110" width="360" height="44" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="220.0" y="128.5" font-size="11.5" fill="#9E3A57" text-anchor="middle" font-weight="bold">Young GC [STW, 짧음]</text>
<text x="220.0" y="143.5" font-size="10" fill="#444" text-anchor="middle">사용 중인 객체를 Survivor/Old 구역으로 복사하고 Eden 영역을 회수</text>
<line x1="220" y1="154" x2="220" y2="167" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<polygon points="220,168.0 370.0,200 220,232.0 70.0,200" fill="#FFF3E0" stroke="#E0A000"/>
<text x="220" y="197" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Old 사용량이 임계치를 넘었나?</text>
<text x="220" y="211" font-size="11" fill="#333" text-anchor="middle">기본 45퍼센트</text>
<polyline points="220,232 220,240 160,240 160,255" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="152" y="250" font-size="11" fill="#2E6B2E" text-anchor="end" font-weight="bold">Y</text>
<polyline points="370,200 380,200 380,262" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="386" y="194" font-size="11" fill="#9E3A57" text-anchor="start" font-weight="bold">N</text>
<rect x="346" y="264" width="80" height="44" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="386.0" y="282.5" font-size="11" fill="#333" text-anchor="middle">Young GC만</text>
<text x="386.0" y="297.5" font-size="11" fill="#333" text-anchor="middle">계속 반복</text>
<rect x="18" y="256" width="284" height="28" rx="6" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="160.0" y="274.0" font-size="11.5" fill="#2E6B2E" text-anchor="middle" font-weight="bold">동시 마킹 Concurrent Marking 시작</text>
<line x1="160" y1="284" x2="160" y2="297" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="18" y="298" width="284" height="28" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="160.0" y="316.0" font-size="11.5" fill="#9E3A57" text-anchor="middle" font-weight="bold">Initial Mark [아주 짧은 STW]</text>
<line x1="160" y1="326" x2="160" y2="339" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="18" y="340" width="284" height="44" rx="6" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="160.0" y="358.5" font-size="11.5" fill="#2E6B2E" text-anchor="middle" font-weight="bold">Concurrent Mark [애플리케이션과 동시]</text>
<text x="160.0" y="373.5" font-size="10.5" fill="#444" text-anchor="middle">구역별 사용하지 않는 객체 양 계산</text>
<line x1="160" y1="384" x2="160" y2="397" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="18" y="398" width="284" height="44" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="160.0" y="416.5" font-size="11.5" fill="#9E3A57" text-anchor="middle" font-weight="bold">Remark, Cleanup [짧은 STW]</text>
<text x="160.0" y="431.5" font-size="10.5" fill="#444" text-anchor="middle">객체 없는 구역은 즉시 회수</text>
<line x1="160" y1="442" x2="160" y2="455" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="18" y="456" width="284" height="58" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="160.0" y="474.0" font-size="11.5" fill="#9E3A57" text-anchor="middle" font-weight="bold">Mixed GC [STW]</text>
<text x="160.0" y="489.0" font-size="10.5" fill="#444" text-anchor="middle">Young + 사용하지 않는 객체 많은 Old 구역</text>
<text x="160.0" y="504.0" font-size="10.5" fill="#444" text-anchor="middle">일부를 함께 회수 garbage first</text>
<polyline points="160,514 160,536 210,536" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<polyline points="386,308 386,536 230,536" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="220" y1="536" x2="220" y2="551" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<circle cx="220" cy="561" r="9" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/>
<circle cx="220" cy="561" r="5" fill="#333"/>
</svg>
