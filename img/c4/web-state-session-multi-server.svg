<text x="226" y="160" font-size="9.5" fill="#888" text-anchor="middle">요청 2</text>
<text x="10" y="214" font-size="10.5" fill="#333" text-anchor="start" font-weight="bold">해결책 (인프라는 더 복잡해집니다)</text>
<rect x="10" y="224" width="205" height="46" rx="6" fill="#E9F2E9" stroke="#8FBF8F" stroke-dasharray="4 3"/>
