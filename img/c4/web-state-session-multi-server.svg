<rect x="225" y="224" width="205" height="46" rx="6" fill="#E9F2E9" stroke="#8FBF8F" stroke-dasharray="4 3"/>
<text x="327.5" y="243.7" font-size="10.5" fill="#2E6B2E" text-anchor="middle">중앙 세션 저장소 (Redis 등)</text>
<text x="327.5" y="257.7" font-size="10.5" fill="#2E6B2E" text-anchor="middle">모든 서버가 같은 저장소 조회</text>
