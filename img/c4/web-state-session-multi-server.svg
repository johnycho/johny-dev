<text x="52" y="126.9" font-size="10.5" fill="#26508F" text-anchor="middle">세션 ID: abc</text>
<rect x="124" y="90" width="84" height="52" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="166" y="112.4" font-size="10.5" fill="#333" text-anchor="middle">로드</text>
<text x="166" y="126.9" font-size="10.5" fill="#333" text-anchor="middle">밸런서</text>
<line x1="94" y1="116" x2="122" y2="116" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="256" y="40" width="174" height="62" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="266" y="57" font-size="10.5" fill="#9E3A57" text-anchor="start" font-weight="bold">서버 1</text>
<text x="343" y="76.7" font-size="10.5" fill="#333" text-anchor="middle">세션 abc → 유저 A</text>
<text x="343" y="90.7" font-size="10.5" fill="#333" text-anchor="middle">(이 서버에서 생성)</text>
<rect x="256" y="132" width="174" height="62" rx="6" fill="#FDECEC" stroke="#D9534F"/>
<text x="266" y="149" font-size="10.5" fill="#B52B27" text-anchor="start" font-weight="bold">서버 2</text>
<text x="343" y="168.7" font-size="10.5" fill="#B52B27" text-anchor="middle">세션 abc 없음</text>
<text x="343" y="182.7" font-size="10.5" fill="#B52B27" text-anchor="middle">사용자를 식별하지 못함</text>
<line x1="208" y1="104" x2="254" y2="74" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
