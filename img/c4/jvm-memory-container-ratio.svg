<text x="350" y="36" font-size="9.5" fill="#B52B27" text-anchor="middle">컨테이너 메모리 한도</text>
<text x="20" y="62" font-size="11" fill="#333" text-anchor="start" font-weight="bold" font-family="Menlo, Consolas, monospace">MaxRAMPercentage=75</text>
