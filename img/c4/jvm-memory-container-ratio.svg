<text x="308.75" y="92" font-size="10.5" fill="#2E6B2E" text-anchor="middle" font-weight="bold">비힙 여유</text>
<text x="342" y="120" font-size="9.5" fill="#555" text-anchor="end">메타스페이스, 스레드 스택, 다이렉트 버퍼, GC 자체 메모리</text>
