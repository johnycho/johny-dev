<text x="46" y="538" font-size="11" fill="#9E3A57" text-anchor="start" font-weight="bold">주의</text>
<text x="46" y="556" font-size="10.5" fill="#333" text-anchor="start">• 한 곳이라도 블로킹이면 이벤트 루프가 막힘</text>
<text x="46" y="573" font-size="10.5" fill="#333" text-anchor="start">• DB=R2DBC, 외부호출=WebClient로 끝까지 논블로킹</text>
