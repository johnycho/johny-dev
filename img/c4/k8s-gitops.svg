<text x="357" y="113.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<circle cx="24" cy="304" r="8" fill="#4C7FE0"/>
<text x="24" y="307.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="38" y="308" font-size="10.5" fill="#333" text-anchor="start">CI가 컨테이너 이미지를 빌드해 레지스트리에 푸시</text>
