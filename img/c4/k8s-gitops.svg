<text x="24" y="379.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="38" y="380" font-size="10.5" fill="#333" text-anchor="start">클러스터가 이미지를 pull해 파드를 기동</text>
<rect x="20" y="392" width="400" height="26" rx="6" fill="#FFFBEA" stroke="#E0A000" stroke-dasharray="5 4"/>
<text x="220" y="409" font-size="10.5" fill="#5A4300" text-anchor="middle">클러스터 상태가 Git 선언과 달라지면 ArgoCD가 되돌립니다 (self-heal)</text>
