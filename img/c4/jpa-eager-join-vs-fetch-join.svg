<svg xmlns="http://www.w3.org/2000/svg" width="440" height="312" viewBox="0 0 440 312" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="440" height="312" fill="#FFFFFF"/>
<text x="220.0" y="22" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">join만 한 경우와 join fetch의 쿼리 수</text>
<rect x="15" y="36" width="200" height="24" rx="4" fill="#FCE4EC" stroke="#D06A86"/>
<text x="115" y="52" font-size="11.5" fill="#9E3A57" text-anchor="middle" font-weight="bold">join (fetch 없음)</text>
<rect x="20" y="74" width="190" height="42" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="115" y="91.4" font-size="10.5" fill="#333" text-anchor="middle">SELECT o.* 실행</text>
<text x="115" y="105.9" font-size="10.5" fill="#333" text-anchor="middle">조인은 필터링, 정렬에만 사용</text>
<line x1="115" y1="116" x2="115" y2="130" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="20" y="132" width="190" height="42" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="115" y="149.4" font-size="10.5" fill="#333" text-anchor="middle">Order 목록 조회</text>
<text x="115" y="163.9" font-size="10.5" fill="#333" text-anchor="middle">member는 프록시</text>
<line x1="115" y1="174" x2="115" y2="188" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="20" y="190" width="190" height="42" rx="6" fill="#FFF3E0" stroke="#E0A000" stroke-dasharray="4 3"/>
<text x="115" y="207.4" font-size="10.5" fill="#333" text-anchor="middle">getMember() 접근 시</text>
<text x="115" y="221.9" font-size="10.5" fill="#333" text-anchor="middle">주문마다 member SELECT 추가</text>
<line x1="115" y1="232" x2="115" y2="246" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="20" y="248" width="190" height="30" rx="6" fill="#FDECEC" stroke="#D9534F"/>
<text x="115" y="267" font-size="11.5" fill="#B52B27" text-anchor="middle" font-weight="bold">1 + N번 쿼리 (N+1)</text>
<rect x="225" y="36" width="200" height="24" rx="4" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="325" y="52" font-size="11.5" fill="#2E6B2E" text-anchor="middle" font-weight="bold">join fetch</text>
<rect x="230" y="74" width="190" height="42" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="325" y="91.4" font-size="10.5" fill="#333" text-anchor="middle">SELECT o.*, m.* 실행</text>
<text x="325" y="105.9" font-size="10.5" fill="#333" text-anchor="middle">연관까지 한 SELECT로 조회</text>
<line x1="325" y1="116" x2="325" y2="130" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="230" y="132" width="190" height="42" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="325" y="149.4" font-size="10.5" fill="#333" text-anchor="middle">Order와 Member를</text>
<text x="325" y="163.9" font-size="10.5" fill="#333" text-anchor="middle">함께 영속화</text>
<line x1="325" y1="174" x2="325" y2="188" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="230" y="190" width="190" height="42" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="325" y="207.4" font-size="10.5" fill="#333" text-anchor="middle">getMember() 접근 시</text>
<text x="325" y="221.9" font-size="10.5" fill="#333" text-anchor="middle">추가 쿼리 없음</text>
<line x1="325" y1="232" x2="325" y2="246" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="230" y="248" width="190" height="30" rx="6" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="325" y="267" font-size="11.5" fill="#2E6B2E" text-anchor="middle" font-weight="bold">1번 쿼리</text>
<text x="220.0" y="300" font-size="10" fill="#888" text-anchor="middle">로딩 여부는 조인이 아니라 fetch 지정으로 결정됩니다</text>
</svg>
