<text x="300" y="267.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
<line x1="244" y1="250" x2="244" y2="189" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<circle cx="256" cy="220" r="8" fill="#4C7FE0"/>
<text x="256" y="223.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text>
<circle cx="24" cy="322" r="8" fill="#4C7FE0"/>
<text x="24" y="325.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="38" y="326" font-size="10.5" fill="#333" text-anchor="start">사용자가 kubectl apply로 배포를 요청</text>
<circle cx="24" cy="340" r="8" fill="#4C7FE0"/>
<text x="24" y="343.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="38" y="344" font-size="10.5" fill="#333" text-anchor="start">API 서버가 원하는 상태를 etcd에 저장</text>
<circle cx="24" cy="358" r="8" fill="#4C7FE0"/>
<text x="24" y="361.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="38" y="362" font-size="10.5" fill="#333" text-anchor="start">스케줄러가 노드 미배정 파드를 발견해 노드를 선택</text>
<circle cx="24" cy="376" r="8" fill="#4C7FE0"/>
<text x="24" y="379.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="38" y="380" font-size="10.5" fill="#333" text-anchor="start">API 서버가 "파드를 노드 N에"를 etcd에 기록</text>
