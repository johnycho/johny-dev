<text x="24" y="397.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="38" y="398" font-size="10.5" fill="#333" text-anchor="start">kubelet이 내 노드에 배정된 파드를 확인</text>
<circle cx="24" cy="412" r="8" fill="#4C7FE0"/>
<text x="24" y="415.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
<text x="38" y="416" font-size="10.5" fill="#333" text-anchor="start">kubelet이 컨테이너 런타임에 실행을 지시</text>
<circle cx="24" cy="430" r="8" fill="#4C7FE0"/>
<text x="24" y="433.5" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text>
<text x="38" y="434" font-size="10.5" fill="#333" text-anchor="start">kubelet이 상태(Running)를 API 서버에 보고</text>
