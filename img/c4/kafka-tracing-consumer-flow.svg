<text x="138.0" y="286" font-size="10" fill="#555" text-anchor="middle" font-weight="bold">Y</text>
<line x1="280.0" y1="270" x2="318.0" y2="300" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="302.0" y="286" font-size="10" fill="#555" text-anchor="middle" font-weight="bold">N</text>
<rect x="34" y="300" width="176" height="34" rx="6" fill="#EEF3FB" stroke="#4C7FE0"/>
<text x="122.0" y="314" font-size="10.5" fill="#333" text-anchor="middle">Kafka native headers의</text>
