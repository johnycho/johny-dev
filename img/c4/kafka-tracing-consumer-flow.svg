<text x="220.0" y="170" font-size="10.5" fill="#26508F" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">OpenTelemetryKafkaTracer.run()</text>
<text x="220.0" y="186" font-size="10.5" fill="#333" text-anchor="middle">메시지마다 아래 과정 반복</text>
