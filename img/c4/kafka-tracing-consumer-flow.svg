<text x="220.0" y="112" font-size="10.5" fill="#26508F" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">MessageConsumer.consume()</text>
<text x="220.0" y="128" font-size="10.5" fill="#333" text-anchor="middle">기본 구현이 트레이서 호출</text>
