<text x="318.0" y="314" font-size="10.5" fill="#333" text-anchor="middle">Spring Message 헤더에서</text>
<text x="318.0" y="328" font-size="10.5" fill="#333" text-anchor="middle">추출 (fallback)</text>
<line x1="220.0" y1="342" x2="220.0" y2="356" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="70" y="356" width="300" height="44" rx="6" fill="#EEF3FB" stroke="#4C7FE0"/>
