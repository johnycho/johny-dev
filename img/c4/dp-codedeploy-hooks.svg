<text x="201" y="235" font-size="10.5" fill="#777" text-anchor="middle">Install</text>
<text x="306" y="235" font-size="10" fill="#555" text-anchor="start">파일 복사</text>
<rect x="106" y="246" width="190" height="22" rx="4" fill="#FFFFFF" stroke="#E8C98F"/>
<text x="201" y="261" font-size="10.5" fill="#333" text-anchor="middle">AfterInstall</text>
<text x="306" y="261" font-size="10" fill="#555" text-anchor="start">권한, 설정 변경</text>
