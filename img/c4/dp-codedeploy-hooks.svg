<text x="201" y="313" font-size="10.5" fill="#333" text-anchor="middle">ValidateService</text>
<text x="306" y="313" font-size="10" fill="#555" text-anchor="start">헬스 체크</text>
<rect x="12" y="334" width="84" height="74" rx="6" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="54" y="375.0" font-size="11" fill="#2E6B2E" text-anchor="middle" font-weight="bold">트래픽 허용</text>
