<svg xmlns="http://www.w3.org/2000/svg" width="440" height="470" viewBox="0 0 440 470" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="440" height="470" fill="#FFFFFF"/>
<text x="220" y="22" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">CodeDeploy 인플레이스 배포의 수명 주기 이벤트</text>
<text x="220" y="40" font-size="10" fill="#888" text-anchor="middle">(로드 밸런서를 사용하는 배포 그룹, 서버 한 대 기준)</text>
<rect x="12" y="54" width="84" height="74" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="54" y="95.0" font-size="11" fill="#9E3A57" text-anchor="middle" font-weight="bold">트래픽 차단</text>
<rect x="106" y="54" width="190" height="22" rx="4" fill="#FFFFFF" stroke="#D06A86"/>
<text x="201" y="69" font-size="10.5" fill="#333" text-anchor="middle">BeforeBlockTraffic</text>
<rect x="106" y="80" width="190" height="22" rx="4" fill="#EEEEEE" stroke="#BBBBBB" stroke-dasharray="4 3"/>
<text x="201" y="95" font-size="10.5" fill="#777" text-anchor="middle">BlockTraffic</text>
<text x="306" y="95" font-size="10" fill="#555" text-anchor="start">타깃 그룹에서 제외</text>
<rect x="106" y="106" width="190" height="22" rx="4" fill="#FFFFFF" stroke="#D06A86"/>
<text x="201" y="121" font-size="10.5" fill="#333" text-anchor="middle">AfterBlockTraffic</text>
<rect x="12" y="142" width="84" height="178" rx="6" fill="#FFF3E0" stroke="#E8C98F"/>
<text x="54" y="235.0" font-size="11" fill="#7A5200" text-anchor="middle" font-weight="bold">설치</text>
<rect x="106" y="142" width="190" height="22" rx="4" fill="#FFFFFF" stroke="#E8C98F"/>
<text x="201" y="157" font-size="10.5" fill="#333" text-anchor="middle">ApplicationStop</text>
<text x="306" y="157" font-size="10" fill="#555" text-anchor="start">기존 앱 종료</text>
<rect x="106" y="168" width="190" height="22" rx="4" fill="#EEEEEE" stroke="#BBBBBB" stroke-dasharray="4 3"/>
<text x="201" y="183" font-size="10.5" fill="#777" text-anchor="middle">DownloadBundle</text>
<text x="306" y="183" font-size="10" fill="#555" text-anchor="start">번들 내려받기</text>
