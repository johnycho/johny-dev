<text x="201" y="349" font-size="10.5" fill="#333" text-anchor="middle">BeforeAllowTraffic</text>
<rect x="106" y="360" width="190" height="22" rx="4" fill="#EEEEEE" stroke="#BBBBBB" stroke-dasharray="4 3"/>
<text x="201" y="375" font-size="10.5" fill="#777" text-anchor="middle">AllowTraffic</text>
<text x="306" y="375" font-size="10" fill="#555" text-anchor="start">타깃 그룹에 등록</text>
<rect x="106" y="386" width="190" height="22" rx="4" fill="#FFFFFF" stroke="#8FBF8F"/>
<text x="201" y="401" font-size="10.5" fill="#333" text-anchor="middle">AfterAllowTraffic</text>
<rect x="106" y="426" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#888"/>
<text x="134" y="437" font-size="10" fill="#555" text-anchor="start">appspec.yml에 스크립트를 넣는 이벤트</text>
<rect x="106" y="448" width="22" height="14" rx="3" fill="#EEEEEE" stroke="#BBBBBB" stroke-dasharray="4 3"/>
<text x="134" y="459" font-size="10" fill="#555" text-anchor="start">CodeDeploy가 처리(스크립트 불가)</text>
</svg>
