<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect x="0" y="0" width="440" height="300" fill="#FFFFFF"/>
<text x="220.0" y="22" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">cluster-require-full-coverage — 한 슬롯이 비면?</text>
<rect x="70" y="38" width="300" height="28" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="220.0" y="55.96" font-size="11" fill="#333" text-anchor="middle">샤드1 (슬롯 0-5460) 정상</text>
<rect x="70" y="74" width="300" height="28" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="220.0" y="91.96" font-size="11" fill="#333" text-anchor="middle">샤드2 (슬롯 5461-10922) 정상</text>
<rect x="20" y="110" width="400" height="44" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="220.0" y="128.39" font-size="11.5" fill="#9E3A57" text-anchor="middle">샤드3 (슬롯 10923-16383)</text>
<text x="220.0" y="143.89" font-size="11.5" fill="#9E3A57" text-anchor="middle">마스터, 레플리카 모두 다운</text>
<line x1="60" y1="154" x2="60" y2="213" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="380" y1="154" x2="380" y2="213" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="68" y="182" font-size="10" fill="#555" text-anchor="start">require-full-coverage=yes</text>
<text x="372" y="198" font-size="10" fill="#555" text-anchor="end">require-full-coverage=no</text>
<rect x="16" y="214" width="200" height="62" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="116.0" y="234.28" font-size="10.5" fill="#9E3A57" text-anchor="middle">yes (기본):</text>
<text x="116.0" y="248.78" font-size="10.5" fill="#9E3A57" text-anchor="middle">클러스터 전체 CLUSTERDOWN</text>
<text x="116.0" y="263.28" font-size="10.5" fill="#9E3A57" text-anchor="middle">→ 정상 샤드 요청까지 거부</text>
<rect x="224" y="214" width="200" height="62" rx="6" fill="#E9F2E9" stroke="#8FBF8F"/>
<text x="324.0" y="241.53" font-size="10.5" fill="#2E6B2E" text-anchor="middle">no: 장애 슬롯만 오류</text>
<text x="324.0" y="256.03" font-size="10.5" fill="#2E6B2E" text-anchor="middle">→ 샤드1, 2는 계속 서비스</text>
</svg>
