<text x="220.0" y="93.0" font-size="11.5" fill="#2E6B2E" text-anchor="middle" font-weight="bold">객체 할당 (GC 안 함, 오버헤드 0)</text>
<line x1="220" y1="104" x2="220" y2="125" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
