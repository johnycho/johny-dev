<polyline points="130,154 70,154 70,89 108,89" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="76" y="146" font-size="11" fill="#2E6B2E" text-anchor="start" font-weight="bold">Y</text>
