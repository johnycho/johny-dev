<text x="228" y="202" font-size="11" fill="#9E3A57" text-anchor="start" font-weight="bold">N</text>
<rect x="70" y="216" width="300" height="32" rx="6" fill="#FCE4EC" stroke="#D06A86"/>
<text x="220.0" y="236.0" font-size="11.5" fill="#9E3A57" text-anchor="middle" font-weight="bold">힙이 가득 참 → OutOfMemoryError로 종료</text>
<line x1="220" y1="248" x2="220" y2="268" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
