<svg xmlns="http://www.w3.org/2000/svg" width="440" height="392" viewBox="0 0 440 392" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="440" height="392" fill="#FFFFFF"/>
  <text x="220" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">사람이 개입하는 시점</text>

  <!-- 단계 헤더 -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="118" y="46">요청</text>
    <text x="176" y="46">기획</text>
    <text x="272" y="46">구현</text>
    <text x="362" y="46">검증</text>
    <text x="414" y="46">완료</text>
  </g>
  <line x1="104" y1="54" x2="428" y2="54" stroke="#DDDDDD"/>

  <!-- 1. mattpocock -->
  <text x="8" y="84" font-size="11.5" font-weight="bold" fill="#333">mattpocock</text>
  <text x="8" y="99" font-size="9.5" fill="#888">구현 전에 집중</text>
  <line x1="108" y1="88" x2="426" y2="88" stroke="#CCCCCC" stroke-dasharray="2 3"/>
  <rect x="222" y="81" width="150" height="14" rx="3" fill="#D6E4FB" stroke="#4C7FE0"/>
  <g fill="#FBDCE4" stroke="#D06A86">
    <circle cx="118" cy="88" r="6"/>
    <circle cx="140" cy="88" r="6"/>
    <circle cx="160" cy="88" r="6"/>
    <circle cx="180" cy="88" r="6"/>
    <circle cx="202" cy="88" r="6"/>
    <circle cx="392" cy="88" r="6"/>
  </g>
  <text x="160" y="112" font-size="9.5" fill="#9E3A57" text-anchor="middle">질문에 여러 번 답, 분해안 승인</text>
  <text x="297" y="112" font-size="9.5" fill="#26508F" text-anchor="middle">티켓별 동시 구현</text>
  <text x="400" y="112" font-size="9.5" fill="#9E3A57" text-anchor="middle">리뷰 확인</text>

  <!-- 2. superpowers -->
  <text x="8" y="154" font-size="11.5" font-weight="bold" fill="#333">superpowers</text>
  <text x="8" y="169" font-size="9.5" fill="#888">승인 뒤 자율 진행</text>
  <line x1="108" y1="158" x2="426" y2="158" stroke="#CCCCCC" stroke-dasharray="2 3"/>
  <rect x="226" y="151" width="168" height="14" rx="3" fill="#D6E4FB" stroke="#4C7FE0"/>
  <g fill="#FBDCE4" stroke="#D06A86">
    <circle cx="118" cy="158" r="6"/>
    <circle cx="146" cy="158" r="6"/>
    <circle cx="414" cy="158" r="6"/>
  </g>
  <g fill="#FFF3E0" stroke="#E0A000">
    <path d="M178 150 L186 158 L178 166 L170 158 Z"/>
    <path d="M208 150 L216 158 L208 166 L200 158 Z"/>
  </g>
  <text x="176" y="182" font-size="9.5" fill="#9E3A57" text-anchor="middle">설계 승인, 계획 "go"</text>
  <text x="310" y="182" font-size="9.5" fill="#26508F" text-anchor="middle">태스크 사이에 묻지 않음</text>
  <text x="408" y="182" font-size="9.5" fill="#9E3A57" text-anchor="middle">PR 선택</text>

  <!-- 3. pstack -->
  <text x="8" y="224" font-size="11.5" font-weight="bold" fill="#333">pstack</text>
  <text x="8" y="239" font-size="9.5" fill="#888">끝에서 점검</text>
  <line x1="108" y1="228" x2="426" y2="228" stroke="#CCCCCC" stroke-dasharray="2 3"/>
  <rect x="130" y="221" width="264" height="14" rx="3" fill="#D6E4FB" stroke="#4C7FE0"/>
  <circle cx="272" cy="228" r="9" fill="#FFFFFF" stroke="#D06A86" stroke-dasharray="3 2"/>
  <g fill="#FBDCE4" stroke="#D06A86">
    <circle cx="118" cy="228" r="6"/>
    <circle cx="414" cy="228" r="6"/>
  </g>
  <text x="128" y="252" font-size="9.5" fill="#9E3A57" text-anchor="middle">완료 조건</text>
  <text x="272" y="252" font-size="9.5" fill="#26508F" text-anchor="middle">돌이킬 수 없는 일에서만 정지</text>
  <text x="404" y="252" font-size="9.5" fill="#9E3A57" text-anchor="middle">기록 점검</text>

  <!-- 4. ECC -->
  <text x="8" y="294" font-size="11.5" font-weight="bold" fill="#333">ECC</text>
  <text x="8" y="309" font-size="9.5" fill="#888">계획 확인 뒤 장치</text>
  <line x1="108" y1="298" x2="426" y2="298" stroke="#CCCCCC" stroke-dasharray="2 3"/>
  <rect x="190" y="291" width="204" height="14" rx="3" fill="#D6E4FB" stroke="#4C7FE0"/>
  <rect x="190" y="309" width="204" height="8" rx="2" fill="#FFFBEA" stroke="#E0A000" stroke-dasharray="4 3"/>
  <g fill="#FBDCE4" stroke="#D06A86">
    <circle cx="118" cy="298" r="6"/>
    <circle cx="414" cy="298" r="6"/>
  </g>
  <path d="M170 290 L178 298 L170 306 L162 298 Z" fill="#FFF3E0" stroke="#E0A000"/>
  <text x="160" y="330" font-size="9.5" fill="#9E3A57" text-anchor="middle">계획 확인</text>
  <text x="292" y="330" font-size="9.5" fill="#8A6400" text-anchor="middle">훅이 내내 자동 검사</text>
  <text x="406" y="330" font-size="9.5" fill="#9E3A57" text-anchor="middle">학습 저장</text>

  <!-- 범례 -->
  <line x1="8" y1="346" x2="432" y2="346" stroke="#EEEEEE"/>
  <g font-size="9.5" fill="#555">
    <circle cx="16" cy="364" r="5" fill="#FBDCE4" stroke="#D06A86"/>
    <text x="26" y="367">사람이 답, 승인, 선택</text>
    <path d="M140 358 L146 364 L140 370 L134 364 Z" fill="#FFF3E0" stroke="#E0A000"/>
    <text x="152" y="367">승인해야 진행되는 단계</text>
    <rect x="274" y="358" width="22" height="12" rx="3" fill="#D6E4FB" stroke="#4C7FE0"/>
    <text x="302" y="367">AI 혼자 진행</text>
    <circle cx="16" cy="382" r="6" fill="#FFFFFF" stroke="#D06A86" stroke-dasharray="3 2"/>
    <text x="26" y="385">조건이 맞을 때만 정지</text>
    <text x="152" y="385" fill="#888">간격과 개수는 순서만 뜻하는 개념도</text>
  </g>
</svg>
