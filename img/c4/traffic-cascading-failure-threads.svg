<svg xmlns="http://www.w3.org/2000/svg" width="440" height="278" viewBox="0 0 440 278" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4C7FE0"/></marker></defs>
<rect x="0" y="0" width="440" height="278" fill="#FFFFFF"/>
<text x="220.0" y="22" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">연쇄 장애: 한 곳의 지연이 상류로 전파되는 순서</text>
<rect x="10" y="52" width="96" height="40" rx="6" fill="#EEF3FB" stroke="#4C7FE0"/>
<text x="58" y="68.5" font-size="10" fill="#26508F" text-anchor="middle">B를 사용하는 기능</text>
<text x="58" y="82.5" font-size="10" fill="#26508F" text-anchor="middle">요청</text>
<rect x="10" y="118" width="96" height="40" rx="6" fill="#EEF3FB" stroke="#4C7FE0"/>
<text x="58" y="134.5" font-size="10" fill="#26508F" text-anchor="middle">B와 무관한</text>
<text x="58" y="148.5" font-size="10" fill="#26508F" text-anchor="middle">다른 기능 요청</text>
<rect x="132" y="40" width="160" height="130" rx="6" fill="#F7F7F7" stroke="#999999"/>
<text x="212" y="58" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">서비스 A (상류)</text>
<text x="212" y="74" font-size="9.5" fill="#888" text-anchor="middle">스레드 풀</text>
<rect x="150" y="82" width="124" height="16" rx="3" fill="#FCE4EC" stroke="#D06A86"/>
<text x="212" y="94" font-size="9.5" fill="#9E3A57" text-anchor="middle">B 응답 대기 중</text>
<rect x="150" y="102" width="124" height="16" rx="3" fill="#FCE4EC" stroke="#D06A86"/>
<text x="212" y="114" font-size="9.5" fill="#9E3A57" text-anchor="middle">B 응답 대기 중</text>
<rect x="150" y="122" width="124" height="16" rx="3" fill="#FCE4EC" stroke="#D06A86"/>
<text x="212" y="134" font-size="9.5" fill="#9E3A57" text-anchor="middle">B 응답 대기 중</text>
<rect x="150" y="142" width="124" height="16" rx="3" fill="#FCE4EC" stroke="#D06A86"/>
<text x="212" y="154" font-size="9.5" fill="#9E3A57" text-anchor="middle">B 응답 대기 중</text>
<rect x="322" y="72" width="108" height="52" rx="6" fill="#FDECEC" stroke="#D9534F"/>
<text x="376" y="94.3" font-size="11" fill="#B52B27" text-anchor="middle" font-weight="bold">서비스 B</text>
<text x="376" y="109.3" font-size="11" fill="#B52B27" text-anchor="middle" font-weight="bold">느려짐</text>
<line x1="106" y1="72" x2="148" y2="90" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="274" y1="98" x2="320" y2="98" stroke="#888" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="106" y1="138" x2="146" y2="138" stroke="#D9534F" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="126" y="142" font-size="13" fill="#D9534F" text-anchor="middle" font-weight="bold">✕</text>
<text x="212" y="188" font-size="10" fill="#B52B27" text-anchor="middle" font-weight="bold">빈 스레드가 없어 다른 기능 요청도 대기</text>
<text x="20" y="214" font-size="11" fill="#B52B27" text-anchor="start" font-weight="bold">①</text>
<text x="38" y="214" font-size="10.5" fill="#333" text-anchor="start">서비스 B가 느려집니다.</text>
<text x="20" y="234" font-size="11" fill="#B52B27" text-anchor="start" font-weight="bold">②</text>
<text x="38" y="234" font-size="10.5" fill="#333" text-anchor="start">A의 스레드가 B의 응답을 기다리며 점유된 채 대기합니다.</text>
<text x="20" y="254" font-size="11" fill="#B52B27" text-anchor="start" font-weight="bold">③</text>
<text x="38" y="254" font-size="10.5" fill="#333" text-anchor="start">A의 스레드 풀이 가득 차 B와 무관한 다른 기능까지 멈춥니다.</text>
